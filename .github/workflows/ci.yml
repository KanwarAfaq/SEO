name: Validate SEO Control Center

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          for f in scripts/*.mjs; do
            node --check "$f"
          done
      - name: Verify required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f vercel.json
          test -f .env.example

      - name: Verify live bootstrap and mobile nav
        shell: bash
        run: |
          grep -q "async function bootstrap()" app.js
          grep -q "credentials:'same-origin'" app.js
          grep -q 'id="navBackdrop"' index.html
          grep -q "sidebar.open" styles.css
          grep -q "pages_read_user_content" app.js
          echo "LIVE_BOOTSTRAP_MOBILE_NAV_OK"

      - name: Reject querySelector.forEach runtime bugs
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('app.js','utf8');
          const bad=[...s.matchAll(/(^|[^$])\$\([^;\n]*?\)\.forEach/gm)].map(m=>m[0].trim());
          if(bad.length){
            console.error('querySelector(...).forEach is a runtime bug. Use querySelectorAll helper $$ instead:', bad);
            process.exit(1);
          }
          if(!s.includes('async function bootstrap()')) throw new Error('bootstrap missing');
          if(!s.includes("API request timed out")) throw new Error('API timeout guard missing');
          console.log('FRONTEND_RUNTIME_GUARDS_OK');
          NODE

      - name: Verify static DOM bindings
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const dynamic=new Set(['mSite','mUrl','mGo','mResult']);
          const ids=[...app.matchAll(/\$\('#([^']+)'\)/g)].map(m=>m[1]);
          const missing=[...new Set(ids)].filter(id=>!dynamic.has(id)&&!html.includes('id="'+id+'"'));
          if(missing.length){
            console.error('Missing bound DOM ids:',missing);
            process.exit(1);
          }
          console.log('DOM_BINDINGS_OK');
          NODE

      - name: Verify intelligence routes and Vercel function budget
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const control=fs.readFileSync('api/control.js','utf8');
          const vercel=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          for(const route of ['deep-audit','search-intelligence','index-coverage']){
            if(!control.includes("'"+route+"'")) throw new Error('Missing control route '+route);
            if(!(vercel.rewrites||[]).some(x=>x.source==='/api/'+route)) throw new Error('Missing Vercel rewrite '+route);
          }
          const top=fs.readdirSync('api').filter(x=>x.endsWith('.js')).length;
          if(top>12) throw new Error('Vercel function budget exceeded: '+top+'/12');
          console.log('INTELLIGENCE_ROUTES_OK top_level_functions='+top);
          NODE
