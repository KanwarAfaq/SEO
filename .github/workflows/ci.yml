name: Validate SEO Control Center

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          for f in scripts/*.mjs; do
            node --check "$f"
          done
      - name: Verify required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f vercel.json
          test -f .env.example

      - name: Verify live bootstrap and mobile nav
        shell: bash
        run: |
          grep -q "async function bootstrap()" app.js
          grep -q "credentials:'same-origin'" app.js
          grep -q 'id="navBackdrop"' index.html
          grep -q "sidebar.open" styles.css
          grep -q "pages_read_user_content" app.js
          echo "LIVE_BOOTSTRAP_MOBILE_NAV_OK"
