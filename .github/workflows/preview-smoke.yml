name: Preview runtime smoke

on:
  pull_request:
    branches: [main]

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: https://seo-git-fix-runtime-bootstrap-mobile-kmafaq.vercel.app
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Wait for preview and verify homepage bundle
        shell: bash
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -H "x-vercel-protection-bypass: $BYPASS" -o /tmp/home.html -w "%{http_code}" "$BASE/" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          test "$code" = "200"
          curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/app.js" > /tmp/app.js
          node --check /tmp/app.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/app.js','utf8');
          const bad=[...s.matchAll(/(^|[^$])\$\([^;\n]*?\)\.forEach/gm)];
          if(bad.length) throw new Error('Preview bundle still contains querySelector(...).forEach runtime bug');
          if(!s.includes('async function bootstrap()')) throw new Error('Preview bootstrap missing');
          if(!s.includes('API request timed out')) throw new Error('Preview timeout guard missing');
          console.log('PREVIEW_FRONTEND_RUNTIME_OK');
          NODE

      - name: Verify preview live APIs
        shell: bash
        run: |
          set -e
          for path in config-status sites-health gsc-overview ga4-realtime technical-audit; do
            echo "Checking $path"
            curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/$path" > "/tmp/$path.json"
          done
          fb_code=$(curl -sS -o /tmp/facebook-insights.json -w "%{http_code}" -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/facebook-insights" || true)
          echo "FACEBOOK_PREVIEW_HTTP=$fb_code"
          python - <<'PY'
          import json
          cfg=json.load(open('/tmp/config-status.json'))
          required=['google','line','adminProtection','siteConfig']
          missing=[k for k in required if not cfg.get(k)]
          if missing: raise SystemExit('Missing config: '+','.join(missing))

          health=json.load(open('/tmp/sites-health.json')).get('sites',[])
          if len(health)!=4: raise SystemExit('Expected 4 health sites')

          gsc=json.load(open('/tmp/gsc-overview.json')).get('sites',[])
          if len(gsc)!=4 or any(x.get('error') for x in gsc): raise SystemExit('GSC failed')

          ga=json.load(open('/tmp/ga4-realtime.json')).get('sites',[])
          if len(ga)!=4 or any(x.get('error') or x.get('configured') is False for x in ga): raise SystemExit('GA4 failed')

          try:
              fb=json.load(open('/tmp/facebook-insights.json'))
          except Exception:
              fb={}
          if fb.get('source')=='Meta Graph API':
              print('FACEBOOK_PREVIEW_PAGE',fb.get('page',{}).get('name'))
          else:
              print('FACEBOOK_PREVIEW_SKIPPED_PRODUCTION_SECRET_NOT_AVAILABLE')
          audit=json.load(open('/tmp/technical-audit.json')).get('sites',[])
          if len(audit)!=4: raise SystemExit('Technical audit failed')
          print('PREVIEW_LIVE_APIS_OK')
          PY
