name: SEO digest monitor

on:
  schedule:
    # One concise daily digest at 08:00 Taiwan time (00:00 UTC).
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build portfolio SEO digest and send one LINE message
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SITE_CONFIG_JSON: ${{ secrets.SITE_CONFIG_JSON }}
          SEO_STORAGE_SECRET: ${{ secrets.SEO_STORAGE_SECRET }}
          ADMIN_ACTION_KEY: ${{ secrets.ADMIN_ACTION_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SEO_DASHBOARD_BASE: https://seo-kmafaq.vercel.app
        run: node scripts/monitor.mjs
