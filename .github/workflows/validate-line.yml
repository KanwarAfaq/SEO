name: Validate LINE Flex payload without sending
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-line.yml'
      - 'scripts/digest-format.mjs'
      - 'scripts/line-three-day-visual.mjs'
      - 'scripts/validate-line-payload.mjs'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate both LINE Flex formats without sending a message
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: node scripts/validate-line-payload.mjs
