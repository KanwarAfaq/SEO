name: Live SEO Control Center smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/live-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production
        shell: bash
        run: |
          set +e
          BASE="https://seo-kmafaq.vercel.app"
          echo "=== HOME ==="
          code=$(curl -L -sS -o /tmp/home.html -w "%{http_code}" "$BASE/")
          echo "HTTP=$code"
          head -c 800 /tmp/home.html; echo
          echo
          for path in api/config-status api/sites-health api/gsc-overview api/ga4-realtime api/technical-audit; do
            echo "=== /$path ==="
            code=$(curl -L -sS -o /tmp/out.txt -w "%{http_code}" "$BASE/$path")
            echo "HTTP=$code"
            head -c 5000 /tmp/out.txt; echo
            echo
          done
