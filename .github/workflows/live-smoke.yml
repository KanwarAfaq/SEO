name: Live SEO Control Center smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://seo-kmafaq.vercel.app
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Verify automation bypass is configured
        shell: bash
        run: |
          if [ -z "$BYPASS" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is missing in GitHub Actions secrets"
            exit 1
          fi

      - name: Check production homepage
        shell: bash
        run: |
          set -e
          code=$(curl -L -sS -H "x-vercel-protection-bypass: $BYPASS" -o /tmp/home.html -w "%{http_code}" "$BASE/")
          echo "HOME_HTTP=$code"
          test "$code" = "200"
          grep -q "SEO Control Center" /tmp/home.html
          echo "HOME_OK"

      - name: Check configuration flags
        shell: bash
        run: |
          set -e
          curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/config-status" > /tmp/config.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/config.json'))
          required=["google","facebook","line","adminProtection","siteConfig"]
          missing=[k for k in required if not d.get(k)]
          print("CONFIG_FLAGS", {k: bool(d.get(k)) for k in d})
          if missing:
              raise SystemExit("Missing configuration: "+", ".join(missing))
          PY

      - name: Check all four websites and sitemaps
        shell: bash
        run: |
          set -e
          curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/sites-health" > /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          sites=d.get("sites",[])
          print("HEALTH_COUNT", len(sites))
          for s in sites:
              print(s.get("domain"), "site_ok=", bool(s.get("ok")), "sitemap_ok=", bool(s.get("sitemapOk")))
          if len(sites)!=4:
              raise SystemExit("Expected 4 sites")
          PY

      - name: Check Google Search Console authentication and property access
        shell: bash
        run: |
          set -e
          curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/gsc-overview" > /tmp/gsc.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gsc.json'))
          sites=d.get("sites",[])
          errs=[(s.get("id"),s.get("error")) for s in sites if s.get("error")]
          print("GSC_PROPERTY_COUNT", len(sites), "ERROR_COUNT", len(errs))
          if errs:
              print("GSC_ERRORS", errs)
              raise SystemExit("GSC access failed")
          if len(sites)!=4:
              raise SystemExit("Expected 4 GSC properties")
          PY

      - name: Check GA4 realtime authentication and property access
        shell: bash
        run: |
          set -e
          curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/ga4-realtime" > /tmp/ga.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ga.json'))
          sites=d.get("sites",[])
          errs=[(s.get("id"),s.get("error")) for s in sites if s.get("error")]
          missing=[s.get("id") for s in sites if s.get("configured") is False]
          print("GA4_PROPERTY_COUNT", len(sites), "ERROR_COUNT", len(errs), "UNCONFIGURED_COUNT", len(missing))
          if errs:
              print("GA4_ERRORS", errs)
              raise SystemExit("GA4 access failed")
          if missing:
              print("GA4_UNCONFIGURED", missing)
              raise SystemExit("GA4 properties missing")
          if len(sites)!=4:
              raise SystemExit("Expected 4 GA4 properties")
          PY

      - name: Check Facebook Page Insights
        shell: bash
        run: |
          set -e
          curl -fsS "$BASE/api/facebook-insights" \
            -H "x-vercel-protection-bypass: $BYPASS" > /tmp/facebook.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/facebook.json'))
          assert d.get('source') == 'Meta Graph API', d
          assert d.get('page',{}).get('id'), d
          assert d.get('page',{}).get('name'), d
          print('FACEBOOK_PAGE', d['page']['name'])
          print('FACEBOOK_FOLLOWERS', d['page'].get('followers'))
          print('FACEBOOK_POSTS', len(d.get('posts',[])))
          print('FACEBOOK_METRICS_AVAILABLE', len(d.get('metrics',{})))
          summary=d.get('summary',{})
          assert 'views28d' in summary and 'engagements28d' in summary and 'recentEngagement' in summary, d
          print('FACEBOOK_VIEWS_28D', summary.get('views28d'))
          print('FACEBOOK_ENGAGEMENTS_28D', summary.get('engagements28d'))
          print('FACEBOOK_RECENT_ENGAGEMENT', summary.get('recentEngagement'))
          print('FACEBOOK_RECENT_MEDIA_VIEWS', summary.get('recentPostViews'))
          print('FACEBOOK_POST_VIEW_COVERAGE', summary.get('recentPostViewsKnownCount'), '/', summary.get('recentPostCount'))
          PY

      - name: Check technical audit
        shell: bash
        run: |
          set -e
          curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/technical-audit" > /tmp/audit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/audit.json'))
          sites=d.get("sites",[])
          print("AUDIT_SITE_COUNT", len(sites))
          for s in sites:
              print(s.get("domain"), "audit_ok=", not bool(s.get("error")), "issue_count=", len(s.get("issues") or []))
          if len(sites)!=4:
              raise SystemExit("Expected 4 audit results")
          PY

      - name: Check deep site audit and search intelligence
        shell: bash
        run: |
          set -e
          curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/deep-audit?site=anytool&limit=5" > /tmp/deep.json
          curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/search-intelligence?site=anytool" > /tmp/intel.json
          curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/index-coverage?site=anytool&sample=2" > /tmp/index.json
          curl -fsSL -H "x-vercel-protection-bypass: $BYPASS" "$BASE/api/index-progress" > /tmp/index-progress.json
          python - <<'PY'
          import json
          deep=json.load(open('/tmp/deep.json'))
          assert deep.get('source')=='Live crawl', deep
          assert deep.get('pagesChecked',0)>=3, deep
          assert deep.get('site',{}).get('repository')=='KanwarAfaq/anytool-online', deep
          print('DEEP_AUDIT', deep.get('score'), deep.get('pagesChecked'))

          intel=json.load(open('/tmp/intel.json'))
          sites=intel.get('sites',[])
          assert len(sites)==1 and not sites[0].get('error'), intel
          assert intel.get('priorityRegions')==['Asia','Europe'], intel
          print('SEARCH_INTELLIGENCE', len(sites[0].get('rising',[])), len(sites[0].get('falling',[])), len(sites[0].get('cannibalization',[])))

          idx=json.load(open('/tmp/index.json'))
          sites=idx.get('sites',[])
          assert len(sites)==1 and not sites[0].get('error'), idx
          assert sites[0].get('sampleSize',0)>=2, idx
          print('INDEX_COVERAGE', sites[0].get('sampleSize'), sites[0].get('pass'))

          progress=json.load(open('/tmp/index-progress.json'))
          sites=progress.get('sites',[])
          assert len(sites)==4, progress
          assert all((not s.get('error')) and s.get('totalPages',0)>=1 for s in sites), progress
          p=progress.get('portfolio',{})
          assert p.get('totalPages',0)>=4, progress
          print('INDEX_PROGRESS_TOTAL', p.get('totalPages'))
          print('INDEX_PROGRESS_INDEXED', p.get('indexed'))
          print('INDEX_PROGRESS_NOT_INDEXED', p.get('notIndexed'))
          print('INDEX_PROGRESS_REMAINING', p.get('remaining'))
          PY
