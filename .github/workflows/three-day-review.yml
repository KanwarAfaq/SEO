name: Three-day portfolio SEO + LINE report
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: 'Do not send LINE; generate preview only'
  schedule:
    - cron: '47 5 * * *'
permissions:
  contents: write
concurrency:
  group: seo-three-day-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - id: cadence
        name: Run only on every third UTC day
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != schedule ] || [ $(( $(date -u +%s) / 86400 % 3 )) -eq 0 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.due == 'true'
      - uses: actions/setup-node@v4
        if: steps.cadence.outputs.due == 'true'
        with:
          node-version: '22'
      - name: Validate scanner, dashboard and aggregation
        if: steps.cadence.outputs.due == 'true'
        run: |
          node --check scripts/three-day-review.mjs
          node --check scripts/refresh-indexing.mjs
          node --check indexing-monitor-ui.js
          node --test tests/indexing-monitor.test.mjs
      - name: Refresh five-site Google URL Inspection evidence
        if: steps.cadence.outputs.due == 'true'
        env:
          SITE_CONFIG_JSON: ${{ secrets.SITE_CONFIG_JSON }}
          SEO_DASHBOARD_BASE: https://seo-kmafaq.vercel.app
          ADMIN_ACTION_KEY: ${{ secrets.ADMIN_ACTION_KEY }}
          SEO_STORAGE_SECRET: ${{ secrets.SEO_STORAGE_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SEO_THREE_DAY_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/refresh-indexing.mjs
      - name: Publish latest verified indexing snapshot to dashboard
        if: steps.cadence.outputs.due == 'true' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indexing-refresh.json
          if git diff --cached --quiet; then
            echo "No change to indexing report" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "data(seo): three-day Google URL inspection snapshot"
            git push
          fi
      - name: Portfolio audit and LINE digest
        if: always() && steps.cadence.outputs.due == 'true'
        env:
          SITE_CONFIG_JSON: ${{ secrets.SITE_CONFIG_JSON }}
          SEO_DASHBOARD_BASE: https://seo-kmafaq.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ADMIN_ACTION_KEY: ${{ secrets.ADMIN_ACTION_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SEO_THREE_DAY_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/three-day-review.mjs
      - name: Audit evidence
        if: always() && steps.cadence.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seo-three-day-${{ github.run_id }}
          path: reports/three-day-*
          retention-days: 60
          if-no-files-found: warn
